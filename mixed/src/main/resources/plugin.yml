name: HitBoysMixedPluginLoader
main: com.hitboy.pluginloader.HitBoysMixedPluginLoader
version: 1.1.0
author: HitBoy
description: >
  Runs HitBoy plugins (plugin.json + HitBoyPlugin API) alongside the Bukkit,
  Spigot, Paper, and Purpur plugins on this server.
commands:
  hitboyplugins:
    description: Lists or reloads HitBoy plugins.
    usage: /<command> [reload]
    aliases: [hbp]
api-version: '1.13'
